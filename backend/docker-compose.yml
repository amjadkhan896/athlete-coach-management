# Backend stack: PostgreSQL, migrations, API (and optional demo seed).
# Reads settings from backend/.env. Start: docker compose up -d --build
name: acm-backend

x-api: &api
  image: acm-api:local
  env_file: .env
  environment:
    # Inside Docker the API reaches PostgreSQL by service name on its internal port.
    DB_HOST: postgres
    DB_PORT: 5432

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_MIGRATION_USER}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD}
      # Used by docker/postgres-init to create the restricted runtime user.
      APP_DB_USER: ${DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies pending migrations before the API starts.
  migrate:
    <<: *api
    build: .
    command: ["node", "node_modules/typeorm/cli.js", "-d", "dist/database/data-source.js", "migration:run"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    restart: unless-stopped
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  # Optional demo data: docker compose --profile seed run --rm seed
  seed:
    <<: *api
    profiles: ["seed"]
    command: ["node", "dist/database/seeds/seed.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
    name: acm_pgdata

networks:
  default:
    # Shared with the frontend's docker-compose so the web container can reach "api".
    name: acm-network
