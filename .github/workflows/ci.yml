name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend - lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Backend - migrations and e2e tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: acm
          POSTGRES_USER: acm_owner
          POSTGRES_PASSWORD: ci-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acm_owner -d acm"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: acm
      DB_USER: acm_app
      DB_PASSWORD: ci-app
      DB_MIGRATION_USER: acm_owner
      DB_MIGRATION_PASSWORD: ci-owner
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      SEED_PASSWORD: ChangeMe123!
      PLATFORM_ADMIN_KEY: ci-only-platform-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Create runtime database role
        env:
          POSTGRES_USER: acm_owner
          POSTGRES_DB: acm
          PGHOST: localhost
          PGPASSWORD: ci-owner
          APP_DB_USER: acm_app
          APP_DB_PASSWORD: ci-app
        # Same script the local Docker PostgreSQL runs on first start.
        run: sh docker/postgres-init/01-app-role.sh
      - run: npm run migration:run
      # Proves the down migration works, so a failed release can be rolled back.
      - run: npm run migration:revert && npm run migration:run
      - run: npm run seed
      - run: npm run test:e2e

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: acm-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: acm-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
